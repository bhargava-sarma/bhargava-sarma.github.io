# GitHub Pages (Jekyll) configuration.
#
# The published site is index.html, style.css, app.js, the resume PDF, CNAME,
# robots.txt and dashboard/. Everything below is repo tooling and is not served.
#
# dashboard/ IS published on purpose -- it is the editor at /dashboard/. It holds
# no credentials: editing requires a GitHub token that lives only in the browser
# tab, so the page is inert to anyone who opens it without one.
#
# content.json stays unpublished; the hosted dashboard reads it through the
# GitHub API rather than over HTTP, so it does not need a public URL.
exclude:
  - scripts
  - content.json
  - README.md
  - .gitignore
  - .github
