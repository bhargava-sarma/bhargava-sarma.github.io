<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio dashboard</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: #141416; --panel-2: #1b1b1f;
    --ink: #ededed; --dim: #a0a0a8; --gray: #6d6d78;
    --hair: #26262c; --accent: #7aa2f7; --danger: #f7768e; --ok: #9ece6a;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; background: rgba(11,11,12,0.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--hair);
  }
  header h1 { font-size: 15px; font-family: var(--mono); font-weight: 700; letter-spacing: -0.01em; }
  header .spacer { flex: 1; }
  #status { font-family: var(--mono); font-size: 12px; color: var(--gray); }
  #status.ok { color: var(--ok); } #status.err { color: var(--danger); } #status.busy { color: var(--accent); }

  button {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--hair);
    padding: 8px 14px; cursor: pointer; border-radius: 4px;
  }
  button:hover { border-color: var(--gray); }
  button.primary { background: var(--accent); color: #0b0b0c; border-color: var(--accent); font-weight: 700; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.icon { padding: 5px 9px; line-height: 1; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }

  .layout { display: grid; grid-template-columns: 190px 1fr; gap: 28px; padding: 24px; max-width: 1100px; margin: 0 auto; align-items: start; }
  nav { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; }
  nav a { font-family: var(--mono); font-size: 12.5px; color: var(--dim); text-decoration: none; padding: 8px 10px; border-radius: 4px; }
  nav a:hover { background: var(--panel); color: var(--ink); }

  section.card { background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; padding: 20px; margin-bottom: 22px; scroll-margin-top: 80px; }
  section.card > h2 { font-size: 14px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin-bottom: 4px; }
  section.card > p.hint { font-size: 12.5px; color: var(--gray); margin-bottom: 16px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray); margin-bottom: 5px; }
  input[type=text], textarea {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--hair); border-radius: 4px; padding: 9px 11px;
    font-family: var(--sans); font-size: 14px; line-height: 1.5; resize: vertical;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 76px; }

  .item { background: var(--panel-2); border: 1px solid var(--hair); border-radius: 6px; padding: 14px; margin-bottom: 12px; }
  .item__bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .item__title { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > .field { flex: 1; min-width: 190px; }
  .sub { margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--hair); }
  .empty { font-family: var(--mono); font-size: 12px; color: var(--gray); padding: 8px 0 12px; }
</style>
</head>
<body>

<header>
  <h1>Portfolio dashboard</h1>
  <span id="status">loading…</span>
  <span class="spacer"></span>
  <button id="reloadBtn" type="button">Discard changes</button>
  <button id="previewBtn" type="button">Open preview</button>
  <button id="saveBtn" class="primary" type="button" disabled>Save &amp; rebuild</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="form"></main>
</div>

<script src="dashboard.js"></script>
</body>
</html>
